[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eidos"
version = "0.1.0"
description = "A tiny reflective continuation calculus and trusted authority substrate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "kosmourgia" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
